<script>
/* GitHub Pages serves this file at any missing path, so relative URLs must resolve from the site root:
   /alldreamsreal/ while the site lives under a user domain, / once it has its own domain. */
(function () {
  if (location.protocol.indexOf('http') !== 0) return;
  var base = location.pathname.indexOf('/alldreamsreal/') === 0 ? '/alldreamsreal/' : '/';
  var el = document.createElement('base');
  el.href = base;
  document.head.prepend(el);
})();
</script>

:root{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--ink);color:var(--undyed);display:grid;place-items:center;overflow:hidden}

.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mark{position:fixed;top:var(--s4);left:var(--gutter);font:400 20px/1 var(--display);color:var(--newsprint);text-decoration:none;z-index:2}
.mark:focus-visible{outline:2px solid var(--newsprint);outline-offset:3px}
/* PAGE UNAVAILABLE: wide, spaced, no punctuation. Syncopate stands in for the Solarflare lettering.
   token-lint: exempt (the one reference-matched page: Syncopate and the cyan/magenta edge follow
   the Solarflare reference, so they sit outside the tokens on purpose) */
h1{position:fixed;left:0;right:0;bottom:18vh;bottom:18svh;margin:0;z-index:1;text-align:center;
  font:400 clamp(17px,4.6vw,54px)/1.5 "Syncopate",sans-serif;letter-spacing:.55em;text-transform:uppercase;
  text-shadow:-2px 0 rgba(255,64,214,.7),2px 0 rgba(64,236,255,.7),0 0 22px rgba(24,8,64,.55)}

</style>
